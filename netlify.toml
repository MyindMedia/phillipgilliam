# Static site, no build step. The only server code is the eBook download check.
[build]
  publish = "."
  functions = "netlify/functions"

# The site publishes from the repo root, so keep function source and project notes off the web.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/Grilled.md"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/confirmation.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
